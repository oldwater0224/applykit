# 워크플로우 이름 — GitHub Actions 탭에서 이 이름으로 표시됨
name: CI

# 언제 실행할지 설정
on:
  push:
    branches: [main, master, develop] # 이 브랜치에 push 시 실행
  pull_request:
    branches: [main, master]          # 이 브랜치로 PR 생성 시 실행

jobs:
  ci:
    # GitHub이 제공하는 Ubuntu 서버에서 실행
    runs-on: ubuntu-latest

    steps:
      # 1. 코드를 GitHub Actions 서버에 내려받기
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Node.js 버전 설정
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm' # npm 캐시 활용해서 설치 속도 향상

      # 3. 패키지 설치
      # npm ci는 npm install보다 엄격하고 빠름
      # package-lock.json 기준으로 정확히 설치
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript 타입 체크
      # --noEmit: 실제 파일 생성 없이 타입 오류만 체크
      - name: Type check
        run: npx tsc --noEmit

      # 5. ESLint 코드 검사
      # 코드 스타일, 잠재적 오류 검사
      - name: Lint
        run: npx eslint src --ext .ts,.tsx
        
      # 6. Jest 테스트 실행
      # --passWithNoTests: 테스트 파일 없어도 통과 (초반엔 테스트 없으니까)
      - name: Test
        run: npm test -- --passWithNoTests

      # 7. vercel.json cron 등록 확인
      # vercel.json이 .gitignore에 포함되거나 crons 설정이 누락되면 배포 시 cron job이 등록되지 않음
      - name: Verify vercel.json crons
        run: |
          # vercel.json이 .gitignore에 포함되어 있는지 확인
          if grep -qE '^\s*vercel\.json\s*$' .gitignore 2>/dev/null; then
            echo "::error::vercel.json이 .gitignore에 포함되어 있습니다. 배포 시 cron job이 등록되지 않습니다."
            exit 1
          fi

          # vercel.json 파일 존재 확인
          if [ ! -f vercel.json ]; then
            echo "::error::vercel.json 파일이 존재하지 않습니다. cron job이 등록되지 않습니다."
            exit 1
          fi

          # crons 배열이 존재하고 비어있지 않은지 확인
          CRON_COUNT=$(node -e "const v = require('./vercel.json'); console.log(Array.isArray(v.crons) ? v.crons.length : 0)")
          if [ "$CRON_COUNT" -eq 0 ]; then
            echo "::error::vercel.json에 crons 설정이 비어있습니다."
            exit 1
          fi

          # 각 cron 항목에 path와 schedule이 있는지 확인
          node -e "
            const v = require('./vercel.json');
            for (const [i, c] of v.crons.entries()) {
              if (!c.path) { console.error('::error::crons[' + i + ']에 path가 없습니다.'); process.exit(1); }
              if (!c.schedule) { console.error('::error::crons[' + i + ']에 schedule이 없습니다.'); process.exit(1); }
            }
            console.log('vercel.json crons 검증 통과: ' + v.crons.length + '개 cron job 확인');
            v.crons.forEach(c => console.log('  - ' + c.path + ' (' + c.schedule + ')'));
          "

      # 8. Next.js 빌드
      - name: Build
        run: npm run build
        env:
          # 빌드 시 필요한 환경변수 — GitHub Secrets에서 가져옴
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}